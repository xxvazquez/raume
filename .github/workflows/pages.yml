name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, so the build number can count it
      - uses: actions/configure-pages@v5
      - name: Cache-bust static assets
        # Each asset's ?v= becomes its own content hash, so a deploy changes
        # only the URLs of files that changed; the commit SHA then names the
        # service-worker cache (and anything left unstamped).
        run: |
          node scripts/stamp-asset-versions.js
          sed -i "s/__CACHEBUST__/${GITHUB_SHA}/g" index.html sw.js
      - name: Stamp version and date in the footer
        # "Version 1.0 (512) · 2 Oct 2026, 22:09 CEST": the version from
        # package.json (1.0.0 reads 1.0), the build number (every commit on main counts one, so
        # it only ever goes up), and the commit time in Warsaw.
        run: |
          VERSION=$(node -p "require('./package.json').version.replace(/\\.0$/, '')")
          BUILD=$(git rev-list --count HEAD)
          WHEN=$(TZ=Europe/Warsaw git log -1 --format=%cd --date=format-local:'%-d %b %Y, %H:%M %Z')
          STAMP="Version ${VERSION} (${BUILD}) · ${WHEN}"
          sed -i "s|<!--build-->[^<]*<!--/build-->|${STAMP}|" index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
