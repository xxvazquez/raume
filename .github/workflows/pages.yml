name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Cache-bust static assets
        # Each asset's ?v= becomes its own content hash, so a deploy changes
        # only the URLs of files that changed; the commit SHA then names the
        # service-worker cache (and anything left unstamped).
        run: |
          node scripts/stamp-asset-versions.js
          sed -i "s/__CACHEBUST__/${GITHUB_SHA}/g" index.html sw.js
      - name: Stamp version and date in the footer
        run: |
          STAMP="Version ${GITHUB_SHA::7} · $(git log -1 --format=%cd --date=format:'%-d %b %Y')"
          sed -i "s|<!--build-->[^<]*<!--/build-->|${STAMP}|" index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
